[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "search-relevance-judgments"
version = "0.1.0"
description = "Small-scale replication of Apple's 'Scaling Search Relevance: Augmenting App Store Ranking with LLM-Generated Judgments' (arXiv 2602.23234) on a public IR benchmark."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0",
    "transformers>=4.40",
    "accelerate>=0.30",
    "rank_bm25>=0.2",
    "ir_datasets>=0.5",
    "scikit-learn>=1.3",
    "lightgbm>=4.0",
    "pandas>=2.0",
    "numpy>=1.24",
]

[project.optional-dependencies]
dev = ["pytest>=7.4"]

[tool.setuptools.packages.find]
include = ["judgment_augmentation*"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
